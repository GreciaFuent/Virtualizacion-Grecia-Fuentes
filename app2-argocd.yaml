apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app2-apache
  namespace: argocd-gffh
spec:
  project: default
  source:
    repoURL: https://github.com/GreciaFuent/Virtualizacion-Grecia-Fuentes.git
    targetRevision: HW-06
    path: apps/app2
  destination:
    server: https://kubernetes.default.svc
    namespace: parcial-gffh
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
