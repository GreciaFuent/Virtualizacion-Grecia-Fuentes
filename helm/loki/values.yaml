
deploymentMode: Monolithic

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: filesystem
  limits_config:
    allow_structured_metadata: true

singleBinary:
  replicas: 1
  persistence:
    enabled: false

gateway:
  enabled: false

minio:
  enabled: false

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
  
chunksCache:
  enabled: false

resultsCache:
  enabled: false