replicas: 1

service:
  type: ClusterIP
  port: 80

persistence:
  enabled: false

adminUser: admin

admin:
  existingSecret: ""
  password: "cambia-esta-clave"

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring-gf.svc.cluster.local
        isDefault: true
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.monitoring-gf.svc.cluster.local:3100

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: Kubernetes
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

extraConfigmapMounts:
  - name: grafana-dashboard-kubernetes
    configMap: grafana-dashboard-kubernetes
    mountPath: /var/lib/grafana/dashboards/default
    readOnly: true