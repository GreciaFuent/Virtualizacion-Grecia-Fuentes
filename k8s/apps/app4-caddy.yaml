apiVersion: apps/v1
kind: Deployment
metadata:
  name: app4-caddy
  namespace: parcial-gffh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app4-caddy
  template:
    metadata:
      labels:
        app: app4-caddy
    spec:
      containers:
        - name: caddy
          image: caddy:2
          ports:
            - containerPort: 80