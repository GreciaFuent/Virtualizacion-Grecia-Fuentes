apiVersion: apps/v1
kind: Deployment
metadata:
  name: app3-httpd
  namespace: parcial-gffh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app3-httpd
  template:
    metadata:
      labels:
        app: app3-httpd
    spec:
      containers:
        - name: httpd
          image: httpd:2.4
          ports:
            - containerPort: 80