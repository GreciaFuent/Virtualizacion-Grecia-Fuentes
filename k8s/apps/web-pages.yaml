apiVersion: v1
kind: ConfigMap
metadata:
  name: app1-html
  namespace: parcial-gffh
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello, I'm Grecia.</title>
    <style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        background: #f5f3ff;
        color: #292524;
    }
    .card {
        text-align: center;
        padding: 60px 40px;
    }
    .small {
        color: #8b5cf6;
        font-size: 14px;
        letter-spacing: 3px;
        text-transform: uppercase;
    }
    h1 {
        font-size: 64px;
        margin: 20px 0 25px;
        font-weight: 700;
    }
    .line {
        width: 50px;
        height: 4px;
        background: #8b5cf6;
        margin: 0 auto 25px;
        border-radius: 10px;
    }
    .author {
        font-size: 14px;
        color: #a8a29e;
    }
    </style>
    </head>
    <body>
    <div class="card">
        <div class="small">Web Application 1</div>
        <h1>Hello, I'm Grecia.</h1>
        <div class="line"></div>
        <p class="author">Made by Grecia Fuentes</p>
    </div>
    </body>
    </html>
---
