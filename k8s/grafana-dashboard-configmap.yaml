apiVersion: v1
data:
  kubernetes-apps.json: "\r\n{\r\n  \"uid\": \"kubernetes-apps\",\r\n  \"title\":
    \"Monitoreo Kubernetes - Grecia\",\r\n  \"tags\": [\"kubernetes\", \"monitoring\"],\r\n
    \ \"timezone\": \"browser\",\r\n  \"schemaVersion\": 39,\r\n  \"version\": 1,\r\n
    \ \"refresh\": \"30s\",\r\n  \"panels\": [\r\n    {\r\n      \"id\": 1,\r\n      \"type\":
    \"stat\",\r\n      \"title\": \"Pods detectados en parcial-gffh\",\r\n      \"gridPos\":
    {\r\n        \"h\": 5,\r\n        \"w\": 12,\r\n        \"x\": 0,\r\n        \"y\":
    0\r\n      },\r\n      \"datasource\": {\r\n        \"type\": \"prometheus\",\r\n
    \       \"uid\": \"Prometheus\"\r\n      },\r\n      \"targets\": [\r\n        {\r\n
    \         \"expr\": \"count(kube_pod_info{namespace=\\\"parcial-gffh\\\"})\",\r\n
    \         \"refId\": \"A\",\r\n          \"legendFormat\": \"Pods\"\r\n        }\r\n
    \     ],\r\n      \"options\": {\r\n        \"reduceOptions\": {\r\n          \"calcs\":
    [\"lastNotNull\"],\r\n          \"fields\": \"\",\r\n          \"values\": false\r\n
    \       },\r\n        \"orientation\": \"auto\",\r\n        \"textMode\": \"auto\",\r\n
    \       \"colorMode\": \"value\",\r\n        \"graphMode\": \"area\",\r\n        \"justifyMode\":
    \"auto\"\r\n      },\r\n      \"fieldConfig\": {\r\n        \"defaults\": {\r\n
    \         \"unit\": \"short\",\r\n          \"min\": 0\r\n        },\r\n        \"overrides\":
    []\r\n      }\r\n    },\r\n    {\r\n      \"id\": 2,\r\n      \"type\": \"timeseries\",\r\n
    \     \"title\": \"Estado de los pods\",\r\n      \"gridPos\": {\r\n        \"h\":
    8,\r\n        \"w\": 12,\r\n        \"x\": 12,\r\n        \"y\": 0\r\n      },\r\n
    \     \"datasource\": {\r\n        \"type\": \"prometheus\",\r\n        \"uid\":
    \"Prometheus\"\r\n      },\r\n      \"targets\": [\r\n        {\r\n          \"expr\":
    \"kube_pod_status_ready{namespace=\\\"parcial-gffh\\\", condition=\\\"true\\\"}\",\r\n
    \         \"refId\": \"A\",\r\n          \"legendFormat\": \"{{pod}}\"\r\n        }\r\n
    \     ],\r\n      \"fieldConfig\": {\r\n        \"defaults\": {\r\n          \"min\":
    0,\r\n          \"max\": 1,\r\n          \"unit\": \"short\"\r\n        },\r\n
    \       \"overrides\": []\r\n      },\r\n      \"options\": {\r\n        \"legend\":
    {\r\n          \"displayMode\": \"list\",\r\n          \"placement\": \"bottom\"\r\n
    \       },\r\n        \"tooltip\": {\r\n          \"mode\": \"multi\",\r\n          \"sort\":
    \"none\"\r\n        }\r\n      }\r\n    },\r\n    {\r\n      \"id\": 3,\r\n      \"type\":
    \"timeseries\",\r\n      \"title\": \"CPU de los pods\",\r\n      \"gridPos\":
    {\r\n        \"h\": 8,\r\n        \"w\": 12,\r\n        \"x\": 0,\r\n        \"y\":
    8\r\n      },\r\n      \"datasource\": {\r\n        \"type\": \"prometheus\",\r\n
    \       \"uid\": \"Prometheus\"\r\n      },\r\n      \"targets\": [\r\n        {\r\n
    \         \"expr\": \"sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\\\"parcial-gffh\\\",
    container!=\\\"\\\", container!=\\\"POD\\\"}[5m]))\",\r\n          \"refId\":
    \"A\",\r\n          \"legendFormat\": \"{{pod}}\"\r\n        }\r\n      ],\r\n
    \     \"fieldConfig\": {\r\n        \"defaults\": {\r\n          \"unit\": \"cores\",\r\n
    \         \"min\": 0\r\n        },\r\n        \"overrides\": []\r\n      },\r\n
    \     \"options\": {\r\n        \"legend\": {\r\n          \"displayMode\": \"list\",\r\n
    \         \"placement\": \"bottom\"\r\n        },\r\n        \"tooltip\": {\r\n
    \         \"mode\": \"multi\",\r\n          \"sort\": \"none\"\r\n        }\r\n
    \     }\r\n    }\r\n  ]\r\n}\r\n"
  logs-apps.json: "\r\n{\r\n  \"uid\": \"logs-apps\",\r\n  \"title\": \"Logs de aplicaciones
    - Grecia\",\r\n  \"tags\": [\"kubernetes\", \"logs\", \"loki\"],\r\n  \"timezone\":
    \"browser\",\r\n  \"schemaVersion\": 39,\r\n  \"version\": 1,\r\n  \"refresh\":
    \"10s\",\r\n  \"panels\": [\r\n    {\r\n      \"id\": 1,\r\n      \"type\": \"logs\",\r\n
    \     \"title\": \"Logs de las cuatro aplicaciones\",\r\n      \"datasource\":
    {\r\n        \"type\": \"loki\",\r\n        \"uid\": \"Loki\"\r\n      },\r\n
    \     \"gridPos\": {\r\n        \"h\": 14,\r\n        \"w\": 24,\r\n        \"x\":
    0,\r\n        \"y\": 0\r\n      },\r\n      \"targets\": [\r\n        {\r\n          \"refId\":
    \"A\",\r\n          \"expr\": \"{namespace=\\\"parcial-gffh\\\", pod=~\\\"app1-nginx.*|app2-apache.*|app3-httpd.*|app4-caddy.*\\\"}\",\r\n
    \         \"queryType\": \"range\"\r\n        }\r\n      ],\r\n      \"options\":
    {\r\n        \"showTime\": true,\r\n        \"showLabels\": true,\r\n        \"showCommonLabels\":
    false,\r\n        \"wrapLogMessage\": true,\r\n        \"sortOrder\": \"Descending\",\r\n
    \       \"enableLogDetails\": true,\r\n        \"dedupStrategy\": \"none\"\r\n
    \     }\r\n    }\r\n  ]\r\n}\r\n"
kind: ConfigMap
metadata:
  name: grafana-dashboard-kubernetes
  namespace: monitoring-gf
